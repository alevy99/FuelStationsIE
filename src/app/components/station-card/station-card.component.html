<ion-card class="station-card" button (click)="openDetail()">
  <ion-card-content>

    <div class="card-row">
      <div class="logo-wrap logo-wrap--small">
        @if (getLogoUrl(station.brand)) {
        <img [src]="getLogoUrl(station.brand)" [alt]="station.brand ?? ''" (error)="logoImg.style.display='none'"
          #logoImg />
        } @else {
        <span class="logo-fallback">⛽</span>
        }
      </div>

      <div class="card-info">
        <p class="station-name">{{ station.name }}</p>
        @if (station.address || station.city) {
        <p class="station-address">
          {{ station.address }}{{ station.address && station.city ? ', ' : '' }}{{ station.city }}
        </p>
        }
        <p class="station-coords">{{ coords }}</p>
      </div>

      <div class="fuel-badges">
        @if (station.hasUnleaded) {
        <ion-badge color="success">Unleaded</ion-badge>
        }
        @if (station.hasDiesel) {
        <ion-badge color="primary">Diesel</ion-badge>
        }
      </div>
    </div>

  </ion-card-content>
</ion-card>
