<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>
      Report Station Status
      <p class="station-subtitle">{{ station.name }}</p>
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  @if (station.hasDiesel) {
    <p class="section-label">DIESEL</p>
    <div class="availability-buttons">
      <button class="avail-btn" [class.active--available]="dieselAvailable === true"
        (click)="dieselAvailable = true">
        <span class="avail-icon">✓</span>
        <span>In Stock</span>
      </button>
      <button class="avail-btn" [class.active--unknown]="dieselAvailable === null"
        (click)="dieselAvailable = null">
        <span class="avail-icon">?</span>
        <span>Unknown</span>
      </button>
      <button class="avail-btn" [class.active--unavailable]="dieselAvailable === false"
        (click)="dieselAvailable = false">
        <span class="avail-icon">✕</span>
        <span>Out</span>
      </button>
    </div>
  }

  @if (station.hasUnleaded) {
    <p class="section-label">UNLEADED / PETROL</p>
    <div class="availability-buttons">
      <button class="avail-btn" [class.active--available]="petrolAvailable === true"
        (click)="petrolAvailable = true">
        <span class="avail-icon">✓</span>
        <span>In Stock</span>
      </button>
      <button class="avail-btn" [class.active--unknown]="petrolAvailable === null"
        (click)="petrolAvailable = null">
        <span class="avail-icon">?</span>
        <span>Unknown</span>
      </button>
      <button class="avail-btn" [class.active--unavailable]="petrolAvailable === false"
        (click)="petrolAvailable = false">
        <span class="avail-icon">✕</span>
        <span>Out</span>
      </button>
    </div>
  }

  <div class="divider"></div>

  <p class="section-label">PURCHASE LIMITS</p>
  <div class="limits-row">
    <div class="limit-field">
      <label>Litre cap</label>
      <div class="input-wrap">
        <input type="number" placeholder="e.g. 20" [(ngModel)]="litreLimit" />
        <span class="input-suffix">L</span>
      </div>
    </div>
    <div class="limit-field">
      <label>Spend cap</label>
      <div class="input-wrap">
        <span class="input-prefix">€</span>
        <input type="number" placeholder="e.g. 50" [(ngModel)]="priceLimit" />
      </div>
    </div>
  </div>

  <div class="divider"></div>

  <p class="section-label">PRICES <span class="optional">(optional)</span></p>
  <div class="limits-row">
    @if (station.hasDiesel) {
      <div class="limit-field">
        <label>Diesel /L</label>
        <div class="input-wrap">
          <span class="input-prefix">€</span>
          <input type="number" step="0.001" placeholder="1.899" [(ngModel)]="diesel" />
        </div>
      </div>
    }
    @if (station.hasUnleaded) {
      <div class="limit-field">
        <label>Unleaded /L</label>
        <div class="input-wrap">
          <span class="input-prefix">€</span>
          <input type="number" step="0.001" placeholder="1.799" [(ngModel)]="petrol" />
        </div>
      </div>
    }
  </div>

</ion-content>

<div class="submit-wrap">
  <button class="submit-btn" (click)="submit()" [disabled]="submitting">
    <ion-icon name="checkmark-outline"></ion-icon>
    {{ submitting ? 'Submitting...' : 'Submit Report' }}
  </button>
</div>
